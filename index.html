<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뮤스 (Mews) · 뮤지컬 뉴스</title>
  <meta
    name="description"
    content="관심있는 뮤지컬을 검색하면 실시간 관련 뉴스를 카드로 모아 보여드려요."
  />
  <meta name="theme-color" content="#5b6f9c" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1320" media="(prefers-color-scheme: dark)" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />

  <!-- Pretendard GOV -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/sun-typeface/PretendardGOV@v1.1.0/dist/web/static/pretendardGOV.min.css"
  />
  <!-- Title fonts: Noto Serif KR (뮤스) + Playfair Display (Mews) -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Playfair+Display:ital,wght@1,700&display=swap"
  />
  <!-- Google Material Icons -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
  />

  <link rel="stylesheet" href="style.css" />

  <!-- 테마 깜빡임 방지: 렌더 전에 저장된 테마 적용 -->
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("mews-theme");
        const theme =
          saved ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>

  <header class="header">
    <div class="header__inner">
      <button
        type="button"
        class="theme-toggle"
        id="themeToggle"
        aria-label="다크 모드 전환"
        title="테마 전환"
      >
        <span class="material-icons-round theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">light_mode</span>
        <span class="material-icons-round theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">dark_mode</span>
      </button>

      <h1 class="header__title">
        <button type="button" class="header__home" id="homeButton" aria-label="처음 화면으로">
          <span class="header__logo" aria-hidden="true">
            <span class="material-icons-round header__logo-icon">auto_stories</span>
            <span class="material-icons-round header__logo-icon header__logo-icon--star">auto_awesome</span>
          </span>
          <span class="header__name">뮤스<span class="header__name-en">Mews</span></span>
        </button>
      </h1>
      <p class="header__tagline">
        관심있는 뮤지컬의 최신 소식을 한눈에 확인하세요.
      </p>
    </div>
  </header>

  <main id="main" class="main">
    <section class="search" aria-label="뮤지컬 검색">
      <form class="search__form" id="searchForm" role="search">
        <label class="search__label" for="searchInput">뮤지컬 작품명 검색</label>
        <div class="search__field">
          <span class="material-icons-round search__field-icon" aria-hidden="true"
            >search</span
          >
          <input
            type="search"
            id="searchInput"
            class="search__input"
            name="query"
            placeholder="작품명 검색 · 작품명&제작사 로 AND 검색"
            autocomplete="off"
            enterkeyhint="search"
          />
          <button type="button" class="search__clear" id="resetButton" aria-label="초기화" hidden>
            <span class="material-icons-round" aria-hidden="true">close</span>
          </button>
          <button type="submit" class="search__button" id="searchButton">
            <span class="material-icons-round" aria-hidden="true">travel_explore</span>
            <span>검색</span>
          </button>
        </div>
      </form>
    </section>

    <section class="results" aria-live="polite" aria-busy="false" id="results">
      <!-- 상태 / 결과가 여기에 렌더링됩니다 -->
      <div class="state state--intro" id="introState">
        <span class="material-icons-round state__icon" aria-hidden="true">nights_stay</span>
        <p class="state__title">뮤지컬 작품명을 검색해 보세요</p>
        <p class="state__desc">관심 있는 작품의 최신 뉴스를 카드로 모아 드릴게요.</p>
        <div class="suggest" id="suggest" aria-label="추천 검색어"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <a
      class="footer__link"
      href="https://litt.ly/chichiboo"
      target="_blank"
      rel="noopener noreferrer"
    >
      Created by. 교육뮤지컬 꿈꾸는 치수쌤
    </a>
    <p class="footer__source">
      데이터 출처 · <strong>네이버 뉴스 검색 API</strong> · <strong>국내 신문사 공식 RSS</strong>
    </p>
  </footer>

  <button type="button" class="scroll-top" id="scrollTop" aria-label="맨 위로" hidden>
    <span class="material-icons-round" aria-hidden="true">keyboard_arrow_up</span>
  </button>

  <script src="app.js" defer></script>
</body>
</html>
